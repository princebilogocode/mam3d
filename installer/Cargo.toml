[package]
name = "mam3d-setup"
version = "0.1.0"
edition = "2024"
description = "Installateur de mam3d (Windows)"

# Projet séparé : il embarque le mam3d.exe déjà construit (voir ../make_installer.ps1).
[workspace]

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
